name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Test isolated article view service
        run: python3 -m unittest discover -s ops/article-views -p 'test_*.py' -v

      - name: Test durable publication worker
        run: python3 -m unittest discover -s ops/publication-worker -p 'test_*.py' -v

      - name: Test read-only search monitors
        run: python3 -m unittest discover -s ops/search-monitor -p 'test_*.py' -v

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://getmasterok.ru
          GHOST_API_URL: ${{ secrets.GHOST_API_URL }}
          GHOST_CONTENT_API_KEY: ${{ secrets.GHOST_CONTENT_API_KEY }}

      - name: Install Chromium for catalog smoke
        run: npx playwright install --with-deps chromium

      - name: Run catalog browser smoke
        run: |
          npm run start -- -p 3456 > /tmp/masterok-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3456/ > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:e2e:catalog || { cat /tmp/masterok-next.log; exit 1; }
        env:
          E2E_BASE_URL: http://127.0.0.1:3456

  # Deploy: Timeweb Cloud auto-deploys from main branch
