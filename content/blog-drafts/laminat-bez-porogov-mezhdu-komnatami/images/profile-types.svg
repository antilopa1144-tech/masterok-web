<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" rx="28" fill="#f4f7f5"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#173b3b"><text x="720" y="68" font-size="42" font-weight="700">Сначала сравните готовые уровни пола</text><text x="390" y="140" font-size="32" font-weight="700">Один уровень</text><text x="1050" y="140" font-size="32" font-weight="700">Разные уровни</text><rect x="150" y="500" width="480" height="100" fill="#d2a773"/><rect x="810" y="500" width="480" height="100" fill="#d2a773"/><rect x="810" y="420" width="260" height="80" fill="#e8c699"/><path d="M340 500q50-70 100 0" fill="none" stroke="#dd7047" stroke-width="20"/><path d="M995 420q60 100 120 80" fill="none" stroke="#dd7047" stroke-width="20"/><text x="390" y="680" font-size="29">Переход оформляет стык</text><text x="1050" y="680" font-size="29">Выравнивание учитывает перепад</text><text x="720" y="805" font-size="26" fill="#596c70">Схема выбора задачи, не чертёж узла и не спецификация профиля</text></g></svg>
