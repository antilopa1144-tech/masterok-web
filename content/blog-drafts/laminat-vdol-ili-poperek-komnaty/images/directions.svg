<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050">
<defs>
 <pattern id="planks" width="100" height="240" patternUnits="userSpaceOnUse"><rect width="100" height="240" fill="#e8c294"/><path d="M0 0V240M50 0V240M0 80H50M50 200H100" fill="none" stroke="#9e724b" stroke-width="2"/></pattern>
 <pattern id="across" href="#planks" patternTransform="rotate(90)"/>
</defs>
<rect width="1440" height="1050" rx="28" fill="#f4f7f5"/>
<g font-family="Arial, sans-serif" fill="#17313a" text-anchor="middle">
 <text x="720" y="72" font-size="38" font-weight="700">Одна комната — два направления</text>
 <text x="365" y="145" font-size="32" font-weight="700">Вдоль длинной стены</text>
 <text x="1075" y="145" font-size="32" font-weight="700">Поперёк длинной стены</text>
 <text x="365" y="204" font-size="28" fill="#237b91">Окно</text><text x="1075" y="204" font-size="28" fill="#237b91">Окно</text>
 <rect x="165" y="250" width="400" height="600" fill="url(#planks)" stroke="#17313a" stroke-width="10"/>
 <rect x="875" y="250" width="400" height="600" fill="url(#across)" stroke="#17313a" stroke-width="10"/>
 <path d="M265 250H465M975 250H1175" stroke="#81c8dc" stroke-width="14"/>
 <text x="365" y="915" font-size="27">Доски от оконной стены</text><text x="365" y="951" font-size="27">в глубину комнаты</text>
 <text x="1075" y="915" font-size="27">Доски параллельны</text><text x="1075" y="951" font-size="27">оконной стене</text>
 <text x="720" y="1012" font-size="24" fill="#586b72">Условный план: не расчёт подрезок и не инструкция по монтажу</text>
