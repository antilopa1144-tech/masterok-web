# Included only in the HTTPS server block for cms.getmasterok.ru.
location ^~ /article-views/ {
    limit_req zone=masterok_views burst=12 nodelay;
    limit_req_status 429;
    client_max_body_size 256;
    client_body_timeout 5s;
    access_log off;
    proxy_pass http://127.0.0.1:3460;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 7s;
    proxy_send_timeout 5s;
}
